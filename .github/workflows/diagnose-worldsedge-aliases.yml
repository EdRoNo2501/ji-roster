name: Diagnose World's Edge aliases

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lookup-aliases:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve roster aliases (read-only)
        run: python scripts/diagnose_worldsedge_aliases.py
