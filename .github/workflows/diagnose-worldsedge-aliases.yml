name: Diagnose World's Edge aliases

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lookup-aliases:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected workflow branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve roster aliases individually (read-only)
        run: python scripts/diagnose_worldsedge_aliases.py
