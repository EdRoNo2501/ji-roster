name: Diagnose World's Edge stats response

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect-response:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect one-player API responses
        run: python scripts/diagnose_worldsedge_response.py
