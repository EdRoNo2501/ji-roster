name: Diagnose remaining JI account IDs

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test alternate aliases and existing AoE2Insights IDs (read-only)
        run: python scripts/diagnose_remaining_aliases.py
